<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartNet 代码编辑器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/code-editor.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/material.min.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-code"></i>
            <span>SmartNet 代码编辑器</span>
            <small>DSL & PyTorch 语法支持</small>
        </div>
        <div class="nav-controls">
            <button class="btn btn-secondary" onclick="switchToVisualMode()">
                <i class="fas fa-project-diagram"></i>
                可视化模式
            </button>
            <button class="btn btn-primary" onclick="parseAndBuild()">
                <i class="fas fa-play"></i>
                解析并构建
            </button>
            <button class="btn btn-success" onclick="trainFromCode()" disabled id="trainBtn">
                <i class="fas fa-rocket"></i>
                开始训练
            </button>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <div class="main-container">
        <!-- 左侧：代码编辑器 -->
        <div class="code-editor-panel">
            <div class="editor-header">
                <div class="editor-tabs">
                    <button class="tab-btn active" data-lang="smartnet">SmartNet DSL</button>
                    <button class="tab-btn" data-lang="pytorch">PyTorch</button>
                    <button class="tab-btn" data-lang="yaml">YAML配置</button>
                </div>
                <div class="editor-controls">
                    <select id="themeSelector">
                        <option value="dracula">Dracula</option>
                        <option value="monokai">Monokai</option>
                        <option value="material">Material</option>
                        <option value="default">Default</option>
                    </select>
                    <button class="btn-icon" onclick="formatCode()"><i class="fas fa-code"></i></button>
                    <button class="btn-icon" onclick="loadExample()"><i class="fas fa-file-import"></i></button>
                    <button class="btn-icon" onclick="exportCode()"><i class="fas fa-download"></i></button>
                </div>
            </div>
            <div class="editor-content">
                <textarea id="codeEditor"></textarea>
            </div>
            <div class="editor-footer">
                <div class="syntax-status">
                    <span class="status-indicator" id="syntaxStatus">
                        <i class="fas fa-check-circle text-success"></i>
                        语法正确
                    </span>
                </div>
                <div class="code-stats">
                    <span>行数: <span id="lineCount">1</span></span>
                    <span>字符: <span id="charCount">0</span></span>
                </div>
            </div>
        </div>

        <!-- 中间：实时预览 -->
        <div class="preview-panel">
            <div class="preview-header">
                <h3><i class="fas fa-eye"></i> 网络架构预览</h3>
                <div class="preview-controls">
                    <button class="btn-sm btn-secondary" onclick="refreshPreview()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button class="btn-sm btn-info" onclick="exportToVisual()">
                        <i class="fas fa-external-link-alt"></i>
                        转到可视化
                    </button>
                </div>
            </div>
            <div class="preview-content">
                <div id="networkPreview" class="network-preview">
                    <div class="preview-placeholder">
                        <i class="fas fa-code-branch"></i>
                        <p>在左侧编辑代码，这里将显示网络架构预览</p>
                    </div>
                </div>
            </div>
            <div class="preview-footer">
                <div class="network-stats">
                    <div class="stat-item">
                        <strong>参数量:</strong>
                        <span id="paramCount">-</span>
                    </div>
                    <div class="stat-item">
                        <strong>层数:</strong>
                        <span id="layerCount">-</span>
                    </div>
                    <div class="stat-item">
                        <strong>内存估计:</strong>
                        <span id="memoryEst">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧：语法帮助和示例 -->
        <div class="help-panel">
            <div class="help-header">
                <h3><i class="fas fa-book"></i> 语法帮助</h3>
            </div>
            <div class="help-content">
                <div class="help-section" id="syntaxHelp">
                    <!-- 动态内容 -->
                </div>
                <div class="examples-section">
                    <h4>快速示例</h4>
                    <div class="example-buttons">
                        <button class="example-btn" onclick="loadExample('simple_mlp')">简单MLP</button>
                        <button class="example-btn" onclick="loadExample('transformer')">Transformer</button>
                        <button class="example-btn" onclick="loadExample('cnn_rnn')">CNN+RNN</button>
                        <button class="example-btn" onclick="loadExample('complex')">复杂网络</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="status-left">
            <span class="status-item">
                <i class="fas fa-microchip"></i>
                <span id="gpuStatus">GPU: 检测中...</span>
            </span>
            <span class="status-item">
                <i class="fas fa-network-wired"></i>
                <span id="networkStatus">网络: 未构建</span>
            </span>
        </div>
        <div class="status-right">
            <span class="status-item">
                <i class="fas fa-clock"></i>
                <span id="lastUpdate">最后更新: 从未</span>
            </span>
            <span class="status-item">
                <i class="fas fa-save"></i>
                <span id="saveStatus">已保存</span>
            </span>
        </div>
    </div>

    <!-- 错误显示模态框 -->
    <div id="errorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-exclamation-triangle"></i> 语法错误</h3>
                <button class="close-btn" onclick="closeErrorModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="errorDetails"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeErrorModal()">关闭</button>
                <button class="btn btn-primary" onclick="fixError()">自动修复</button>
            </div>
        </div>
    </div>

    <!-- 训练进度模态框 -->
    <div id="trainingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-rocket"></i> 模型训练</h3>
            </div>
            <div class="modal-body">
                <div class="training-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="trainingProgress"></div>
                    </div>
                    <div class="progress-text">
                        <span id="trainingStatus">准备训练...</span>
                        <span id="trainingPercent">0%</span>
                    </div>
                </div>
                <div class="training-stats">
                    <div class="stat-row">
                        <span>当前轮次:</span>
                        <span id="currentEpoch">0/0</span>
                    </div>
                    <div class="stat-row">
                        <span>训练损失:</span>
                        <span id="trainLoss">-</span>
                    </div>
                    <div class="stat-row">
                        <span>GPU利用率:</span>
                        <span id="gpuUtil">-</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="stopTraining()">停止训练</button>
            </div>
        </div>
    </div>

    <!-- 脚本文件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/yaml/yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/selection/active-line.min.js"></script>
    <script src="{{ url_for('static', filename='js/smartnet-dsl.js') }}"></script>
    <script src="{{ url_for('static', filename='js/code-editor.js') }}"></script>
</body>
</html>
