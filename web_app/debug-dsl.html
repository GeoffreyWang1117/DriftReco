<!DOCTYPE html>
<html>
<head>
    <title>DSL Debug</title>
</head>
<body>
    <h1>DSL解析器调试</h1>
    <div id="output"></div>
    
    <script>
        // 内联SmartNet DSL解析器的核心函数进行调试
        class SmartNetDSL {
            constructor() {
                this.keywords = ['network', 'layer', 'connection'];
            }
            
            parse(code) {
                console.log('开始解析:', code);
                
                const network = {
                    name: '',
                    parameters: {},
                    layers: [],
                    connections: [],
                    errors: []
                };
                
                try {
                    if (this.isYAMLFormat(code)) {
                        console.log('检测到YAML格式');
                        return this.parseYAML(code);
                    } else {
                        console.log('使用DSL解析');
                        return this.parseSmartNetDSL(code);
                    }
                } catch (error) {
                    console.error('解析错误:', error);
                    network.errors.push({
                        line: 0,
                        message: error.message,
                        type: 'parse_error'
                    });
                    return network;
                }
            }
            
            isYAMLFormat(code) {
                return code.includes('name:') && 
                       code.includes('layers:') && 
                       code.includes('- name:');
            }
            
            parseYAML(code) {
                console.log('解析YAML:', code);
                const network = {
                    name: '',
                    parameters: {},
                    layers: [],
                    connections: [],
                    errors: []
                };
                
                const lines = code.split('\n');
                let currentSection = null;
                let currentLayer = null;
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const trimmed = line.trim();
                    
                    if (!trimmed || trimmed.startsWith('#')) continue;
                    
                    console.log('处理行:', trimmed);
                    
                    // 顶级字段
                    if (trimmed.startsWith('name:')) {
                        network.name = trimmed.split(':', 2)[1].trim();
                        console.log('网络名称:', network.name);
                    } else if (trimmed === 'parameters:') {
                        currentSection = 'parameters';
                        console.log('进入parameters区域');
                    } else if (trimmed === 'layers:') {
                        currentSection = 'layers';
                        console.log('进入layers区域');
                    } else if (trimmed === 'connections:') {
                        currentSection = 'connections';
                        console.log('进入connections区域');
                    } else if (currentSection === 'parameters') {
                        const paramMatch = trimmed.match(/^(\w+):\s*(.+)$/);
                        if (paramMatch) {
                            const [, key, value] = paramMatch;
                            network.parameters[key] = this.parseValue(value);
                            console.log('参数:', key, '=', network.parameters[key]);
                        }
                    } else if (currentSection === 'layers') {
                        if (trimmed.startsWith('- name:')) {
                            currentLayer = {
                                name: trimmed.split(':', 2)[1].trim(),
                                type: '',
                                parameters: {}
                            };
                            network.layers.push(currentLayer);
                            console.log('新层:', currentLayer.name);
                        } else if (currentLayer && trimmed.startsWith('type:')) {
                            currentLayer.type = trimmed.split(':', 2)[1].trim();
                            console.log('层类型:', currentLayer.type);
                        } else if (currentLayer && line.match(/^\s{6,}\w+:/)) {
                            const paramMatch = trimmed.match(/^(\w+):\s*(.+)$/);
                            if (paramMatch) {
                                const [, key, value] = paramMatch;
                                currentLayer.parameters[key] = this.parseValue(value);
                                console.log('层参数:', key, '=', currentLayer.parameters[key]);
                            }
                        }
                    } else if (currentSection === 'connections') {
                        if (trimmed.startsWith('- from:')) {
                            const conn = {
                                from: trimmed.split(':', 2)[1].trim(),
                                to: '',
                                type: 'sequential'
                            };
                            network.connections.push(conn);
                            console.log('新连接 from:', conn.from);
                        } else if (network.connections.length > 0 && trimmed.startsWith('to:')) {
                            const lastConn = network.connections[network.connections.length - 1];
                            lastConn.to = trimmed.split(':', 2)[1].trim();
                            console.log('连接 to:', lastConn.to);
                        } else if (network.connections.length > 0 && trimmed.startsWith('type:')) {
                            const lastConn = network.connections[network.connections.length - 1];
                            lastConn.type = trimmed.split(':', 2)[1].trim();
                            console.log('连接类型:', lastConn.type);
                        }
                    }
                }
                
                console.log('YAML解析完成:', network);
                return network;
            }
            
            parseSmartNetDSL(code) {
                console.log('解析SmartNet DSL:', code);
                // 简化版DSL解析
                return {
                    name: 'TestNet',
                    parameters: {},
                    layers: [],
                    connections: [],
                    errors: []
                };
            }
            
            parseValue(value) {
                value = value.trim();
                if (value === 'true') return true;
                if (value === 'false') return false;
                if (value === 'null') return null;
                if (/^\d+$/.test(value)) return parseInt(value);
                if (/^\d*\.\d+$/.test(value)) return parseFloat(value);
                return value;
            }
        }
        
        // 测试代码
        window.smartNetDSL = new SmartNetDSL();
        
        const testYAML = `name: SimpleMLP

parameters:
  input_dim: 128
  output_dim: 10

layers:
  - name: fc1
    type: Linear
    parameters:
      arg_0: 128
      arg_1: 64
  - name: fc2
    type: Linear
    parameters:
      arg_0: 64
      arg_1: 10

connections:
  - from: fc1
    to: fc2
    type: sequential`;

        console.log('开始测试');
        const result = window.smartNetDSL.parse(testYAML);
        
        document.getElementById('output').innerHTML = `
            <h2>解析结果:</h2>
            <pre>${JSON.stringify(result, null, 2)}</pre>
        `;
        
        console.log('测试完成:', result);
    </script>
</body>
</html>
